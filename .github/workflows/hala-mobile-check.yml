name: Hala Mobile Check

on:
  push:
    branches:
      - hala-mobile
    paths:
      - "mobile/**"
      - "netlify/functions/**"
      - "tests/**"
      - ".github/workflows/hala-mobile-check.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Test existing backend
        run: |
          npm ci
          npm test

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install

      - name: Typecheck mobile app
        working-directory: mobile
        run: npm run typecheck

      - name: Expo doctor
        working-directory: mobile
        run: npx expo-doctor@latest

      - name: Bundle iOS
        working-directory: mobile
        run: npx expo export --platform ios --output-dir dist-ios

      - name: Bundle Android
        working-directory: mobile
        run: npx expo export --platform android --output-dir dist-android
