name: HALA iPhone Expo Go SDK58 Review
on:
  push:
    branches: ["feature/hala-expo-sdk58-20261109"]
    paths: [".github/workflows/hala-sdk58-go-review.yml"]
permissions:
  contents: read
  pull-requests: write
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "1"
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_API_URL: https://deploy-preview-25--noortoona.netlify.app
      EXPO_PUBLIC_PAYMENTS_ENABLED: "false"
      EXPO_UNSTABLE_TUNNEL_V2: "1"
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install SDK58 for payment-disabled Expo Go review only
        run: |
          # Moyasar 0.15 declares webview13 peer; Expo58 ships webview14.
          # For this PREVIEW payments are disabled, not a production native-build approval.
          npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Validate SDK58, tests and iOS bundle
        run: |
          node -e 'const p=require("./package.json");if(!p.dependencies.expo.includes("58."))throw Error("SDK mismatch")'
          npx expo-doctor@latest
          npm run typecheck
          npm test
          npx expo export --platform ios --output-dir dist-sdk58-ios
      - name: Verify Expo project
        run: |
          test -n "$EXPO_TOKEN" || { echo "Missing EXPO_TOKEN"; exit 1; }
          npx --yes eas-cli@24.10.0 whoami
          npx --yes eas-cli@24.10.0 project:info | grep -F '5aeba34d-6f95-424b-92b1-5519b5d20197'
      - name: Open temporary Expo Go 58 iPhone preview tunnel
        run: |
          npx expo start --go --tunnel --port 8098 > /tmp/hala-sdk58-go.log 2>&1 &
          pid=$!
          code=""
          for n in $(seq 1 90); do
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            code=$(grep -Eo '(https?://[A-Za-z0-9._-]+[.]on[.]expo[.]app|exp://[A-Za-z0-9._:/?&=%~-]+)' /tmp/hala-sdk58-go.log | head -n1 || true)
            if [[ "$code" == http://* || "$code" == https://* ]]; then code="exp://${code#*://}"; fi
            [ -n "$code" ] && break
            sleep 2
          done
          if [ -z "$code" ]; then
            echo "::error::No Expo Go SDK58 URL generated."
            tail -55 /tmp/hala-sdk58-go.log
            exit 1
          fi
          echo "Expo Go SDK58 review: $code" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment 27 --repo Noortoona/noortoona --body "Expo Go SDK58 iPhone review URL (temporary, staging backend, payments disabled): $code. No signed iOS install and no native payment verification." || true
          echo "Temporary Expo Go SDK58 URL: $code"
          sleep 600
          kill "$pid" 2>/dev/null || true
